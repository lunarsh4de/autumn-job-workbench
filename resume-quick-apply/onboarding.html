<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>投简历助手已安装</title>
    <style>
      :root{--ink:#16202a;--muted:#66727f;--line:#dce3e8;--accent:#087f73;--soft:#f3f6f7}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}main{width:min(760px,calc(100% - 32px));margin:42px auto 70px}.brand{display:flex;align-items:center;gap:14px}.mark{display:grid;place-items:center;width:52px;height:52px;border-radius:8px;background:var(--accent)}.mark img{width:25px;filter:brightness(0) invert(1)}h1{margin:0;font-size:27px;letter-spacing:0}.brand p{margin:2px 0 0;color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.step{min-height:172px;padding:18px;border:1px solid var(--line);border-radius:7px;background:#fff}.step>span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e2f2ef;color:#087469;font-weight:800}.step img{width:22px;margin:22px 0 10px}.step strong{display:block}.step p{margin:4px 0;color:var(--muted);font-size:13px}.privacy{display:flex;align-items:flex-start;gap:9px;margin-top:16px;padding:12px;border-left:3px solid var(--accent);background:#e8f3f1;color:#315b57}.privacy img{width:18px;flex:0 0 auto;margin-top:3px}.foot{margin-top:18px;color:var(--muted);font-size:13px}@media(max-width:650px){.steps{grid-template-columns:1fr}.step{min-height:0}.step img{margin:14px 0 8px}}
    </style>
  </head>
  <body><main>
    <header class="brand"><span class="mark"><img src="icons/briefcase-business.svg" alt="" /></span><div><h1>投简历助手已安装</h1><p>完成一次设置，之后在岗位页面即可快速填充。</p></div></header>
    <section class="steps">
      <article class="step"><span>1</span><img src="icons/user-round.svg" alt="" /><strong>固定扩展</strong><p>在 Edge 扩展菜单中，将“投简历助手”固定到工具栏。</p></article>
      <article class="step"><span>2</span><img src="icons/file-text.svg" alt="" /><strong>导入资料</strong><p>打开“经历”页选择 PDF、DOCX 或 TXT，确认分类结果后保存。</p></article>
      <article class="step"><span>3</span><img src="icons/zap.svg" alt="" /><strong>开始投递</strong><p>先预览字段；之后可点击填充、按 Alt+Shift+F 或使用网页右键菜单。</p></article>
    </section>
    <div class="privacy"><img src="icons/shield-check.svg" alt="" /><span>资料默认只保存在当前浏览器配置中。插件不会自动提交申请，也不会在所有网站后台常驻。</span></div>
    <p class="foot">现在可以关闭此页，点击工具栏中的扩展图标开始设置。</p>
  </main></body>
</html>
