name: Publish job workbench

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,6 * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resume-quick-apply/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate feed rules and client
        run: |
          python -m unittest discover -s scripts -p test_refresh_jobs.py -v
          npm ci --prefix resume-quick-apply
          npm test --prefix resume-quick-apply
      - name: Load last published public feed
        run: |
          mkdir -p _site/icons
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from refresh_jobs import get_json, read_previous

          # Fixed public catalog only; never load a personal account or backup.
          url = "https://lunarsh4de.github.io/autumn-job-workbench/jobs.json"
          path = Path("_site/jobs.json")
          temporary = Path("_site/previous-feed.tmp")
          try:
              document = get_json(url, 40 * 1024 * 1024)
              temporary.write_text(json.dumps(document, ensure_ascii=False), encoding="utf-8")
              read_previous(temporary)
              temporary.replace(path)
              print("Loaded previous public feed for per-source fallback.")
          except Exception as error:
              temporary.unlink(missing_ok=True)
              print(f"::warning::Previous public feed unavailable; failed sources cannot be restored on this run ({type(error).__name__}).")
          PY
      - name: Refresh public sources with retries
        timeout-minutes: 25
        run: |
          official_sources_healthy=false
          refresh_succeeded=false
          for attempt in 1 2 3; do
            if python scripts/refresh_jobs.py --sources job-sources/sources.json --output _site/jobs.json --allow-partial; then
              refresh_succeeded=true
              if python - <<'PY'
          import json
          import sys

          config = json.load(open("job-sources/sources.json", encoding="utf-8"))
          required = {
              source["id"] for source in config["sources"]
              if source.get("enabled") and source["id"].endswith("-official")
          }
          document = json.load(open("_site/jobs.json", encoding="utf-8"))
          by_id = {source["id"]: source for source in document["meta"]["sources"]}
          # Explicit empty success is healthy and clears that source's old jobs.
          bad = [source_id for source_id in required if by_id.get(source_id, {}).get("status") != "ok"]
          if bad:
              print("Official source retry required:", ", ".join(sorted(bad)))
              sys.exit(1)
          print("Official sources healthy:", len(required))
          PY
              then
                official_sources_healthy=true
                break
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying public sources (attempt $((attempt + 1))/3)."
              sleep 15
            fi
          done
          # A copied feed with old 'ok' statuses cannot prove this run worked.
          if [ "$refresh_succeeded" != true ]; then
            echo "::error::Every refresh attempt failed; preserving the deployed site."
            exit 1
          fi
          if [ "$official_sources_healthy" != true ]; then
            echo "::warning::Publishing a partial feed; failed sources retain their last successful data where available."
          fi
          python - <<'PY'
          import json

          document = json.load(open("_site/jobs.json", encoding="utf-8"))
          jobs = document.get("jobs")
          sources = document.get("meta", {}).get("sources", [])
          successful = [source for source in sources if source.get("status") == "ok"]
          if not isinstance(jobs, list) or not successful:
              raise SystemExit("Cannot publish: no source completed successfully in this run.")
          if any(not job.get("sourceId") or not job.get("id") for job in jobs):
              raise SystemExit("Cannot publish: a job has no stable source ownership.")
          stale = [source.get("id") for source in sources if source.get("status") in {"stale", "error"}]
          print(f"Publishing {len(jobs)} jobs; {len(successful)} successful sources; unavailable: {stale or 'none'}")
          PY
      - name: Prepare and validate static site
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cp resume-quick-apply/dashboard.html _site/index.html
          cp resume-quick-apply/dashboard.css resume-quick-apply/dashboard.js resume-quick-apply/dashboard-data.js resume-quick-apply/github-sync.js resume-quick-apply/catalog.js resume-quick-apply/catalog-data.js resume-quick-apply/catalog-db.js resume-quick-apply/catalog-view.js _site/
          cp resume-quick-apply/data.js resume-quick-apply/backup-sync-data.js resume-quick-apply/resume-parser.js _site/
          cp resume-quick-apply/account-config.js resume-quick-apply/account-data.js resume-quick-apply/account.js _site/
          mkdir -p _site/vendor
          cp resume-quick-apply/vendor/mammoth.browser.min.js resume-quick-apply/vendor/pdf.min.mjs resume-quick-apply/vendor/pdf.worker.min.mjs resume-quick-apply/vendor/supabase.min.js _site/vendor/
          cp resume-quick-apply/icons/*.svg _site/icons/
          cp resume-quick-apply/design-system.css resume-quick-apply/workbench-data.js resume-quick-apply/workbench-sync.js _site/
          python - <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          url = os.environ.get("PUBLIC_SUPABASE_URL", "").strip()
          key = os.environ.get("PUBLIC_SUPABASE_PUBLISHABLE_KEY", "").strip()
          if bool(url) != bool(key):
              raise SystemExit("Configure both public Supabase variables, or leave both empty.")
          if url:
              parsed = urlsplit(url)
              if parsed.scheme != "https" or not parsed.hostname or not parsed.hostname.endswith(".supabase.co") or parsed.username or parsed.password or parsed.query or parsed.fragment or parsed.path not in ("", "/") or parsed.port not in (None, 443):
                  raise SystemExit("PUBLIC_SUPABASE_URL must be an HTTPS *.supabase.co project URL without credentials, query or path.")
              if not key.startswith("sb_publishable_"):
                  try:
                      token = key.split(".")
                      claims = json.loads(base64.urlsafe_b64decode(token[1] + "=" * (-len(token[1]) % 4)))
                      is_anon = len(token) == 3 and claims.get("role") == "anon"
                  except Exception:
                      is_anon = False
                  if not is_anon:
                      raise SystemExit("Only a Supabase publishable/anon public key may be embedded in the site.")
          config = {"supabaseUrl": url, "publishableKey": key, "redirectUrl": "https://lunarsh4de.github.io/autumn-job-workbench/"}
          Path("_site/account-config.js").write_text("globalThis.WorkbenchAccountConfig = Object.freeze(" + json.dumps(config) + ");\n", encoding="utf-8")
          html = Path("_site/index.html").read_text(encoding="utf-8")
          for reference in re.findall(r'''(?:src|href)=["']([^"']+)["']''', html):
              if reference.startswith(("http:", "https:", "#", "data:", "mailto:")):
                  continue
              asset = reference.split("?", 1)[0].split("#", 1)[0]
              if asset and not (Path("_site") / asset).is_file():
                  raise SystemExit(f"Missing static asset: {asset}")
          print("Static assets verified; account configuration " + ("enabled." if url else "disabled (public variables absent)."))
          PY
          for script in _site/*.js; do node --check "$script"; done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
