name: Publish job workbench

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,6 * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/icons
          official_sources_healthy=false
          for attempt in 1 2 3; do
            if python scripts/refresh_jobs.py --sources job-sources/sources.json --output _site/jobs.json --allow-partial && python - <<'PY'
          import json
          import sys

          required = {
              "tencent-campus-official",
              "meituan-campus-official",
              "tesla-campus-official",
              "byd-campus-official",
              "geely-campus-official",
          }
          document = json.load(open("_site/jobs.json", encoding="utf-8"))
          if not isinstance(document.get("jobs"), list) or not document["jobs"]:
              print("Generated job feed is empty.")
              sys.exit(1)
          bad = [
              source for source in document["meta"]["sources"]
              if source.get("id") in required and (source.get("status") != "ok" or not source.get("count"))
          ]
          if bad:
              print("Official source retry required:", json.dumps(bad, ensure_ascii=False))
              sys.exit(1)
          print("Official sources healthy:", len(required))
          PY
            then
              official_sources_healthy=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Official job sources are temporarily unavailable; retrying (attempt $((attempt + 1))/3)."
              sleep 15
            fi
          done
          if [ "$official_sources_healthy" != true ]; then
            echo "::warning::One or more official job sources remain unavailable; publishing the validated partial feed."
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path("_site/jobs.json")
          document = json.loads(path.read_text(encoding="utf-8"))
          jobs = document.get("jobs")
          sources = document.get("meta", {}).get("sources", [])
          successful = [source for source in sources if source.get("status") == "ok" and source.get("count", 0)]
          if not isinstance(jobs, list) or not jobs:
              raise SystemExit("Cannot publish: the generated job feed is empty.")
          if not successful:
              raise SystemExit("Cannot publish: no job source completed successfully.")
          failed = [source.get("name") or source.get("id") for source in sources if source.get("status") == "error"]
          print(f"Publishing {len(jobs)} jobs from {len(successful)} successful source(s); unavailable sources: {failed or 'none'}")
          PY
          fi
          cp resume-quick-apply/dashboard.html _site/index.html
          cp resume-quick-apply/dashboard.css resume-quick-apply/dashboard.js resume-quick-apply/dashboard-data.js resume-quick-apply/github-sync.js resume-quick-apply/catalog.js resume-quick-apply/catalog-data.js resume-quick-apply/catalog-db.js _site/
          cp resume-quick-apply/data.js resume-quick-apply/backup-sync-data.js resume-quick-apply/resume-parser.js _site/
          mkdir -p _site/vendor
          cp resume-quick-apply/vendor/mammoth.browser.min.js resume-quick-apply/vendor/pdf.min.mjs resume-quick-apply/vendor/pdf.worker.min.mjs _site/vendor/
          cp resume-quick-apply/icons/*.svg _site/icons/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
